[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcc-copilot"
version = "0.1.0"
description = "面向软件研发团队的 QCC 赋能工具：确定性内核 + 可分发 Skill"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
pptx = ["python-pptx>=0.6.23"]
render = []
test = []

[project.scripts]
qcc = "qcc_copilot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qcc_copilot = ["resources/*.json", "resources/schemas/*.json", "resources/methods/*.json", "resources/templates/*"]
